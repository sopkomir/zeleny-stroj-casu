<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zelený stroj času – fotosyntéza, dýchanie a vývoj rastlín</title>
<meta name="description" content="Interaktívna appka z biológie podľa ŠVP 2023: fotosyntéza, dýchanie a rast rastlín, ich vývoj v geologických érach a členenie. Tri úrovne, bez registrácie.">
<meta name="author" content="Miroslav Sopko">
<meta name="theme-color" content="#06110c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%2306110c'/%3E%3Cpath d='M10 30c0-11 8-19 20-20 0 12-8 20-20 20z' fill='%2357c46a'/%3E%3Cpath d='M20 3a17 17 0 0 1 17 17' fill='none' stroke='%23ffb020' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ====== Tokeny (základ = tmavý svet) ====== */
:root{
  --bg:#06110c; --bg2:#0b1a13; --card:#0e1f17; --card2:#132a20;
  --line:rgba(214,255,226,.10); --line2:rgba(214,255,226,.20); --grid:rgba(214,255,226,.035);
  --text:#e9f5ee; --mut:#94ad9f;
  --acc:#c8f550; --g1:#d6f74f; --g2:#4ed46b; --on:#0a1a0f;
  --sun:#ffb020; --sun2:#ff8a00; --air:#38e1d6; --ok:#34d399; --bad:#fb7185;
  --r:22px; --fh:'Space Grotesk',system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,monospace; --fb:'Space Grotesk',system-ui,sans-serif;
  --shadow:0 12px 34px rgba(0,0,0,.35);
  --glow1:rgba(78,212,107,.16); --glow2:rgba(255,176,32,.10);
  color-scheme:dark;
}
body.junior{
  --bg:#fff8e8; --bg2:#fff0d0; --card:#ffffff; --card2:#fff7e6;
  --line:rgba(110,70,0,.13); --line2:rgba(110,70,0,.24); --grid:rgba(110,70,0,.045);
  --text:#2b2316; --mut:#7b6a4e; --acc:#2b8f37; --g1:#ffc23d; --g2:#ff8a00; --on:#2b1a00;
  --ok:#15803d; --bad:#e11d48; --fb:'Fredoka',system-ui,sans-serif; --fh:'Fredoka',system-ui,sans-serif;
  --shadow:0 8px 24px rgba(120,80,0,.12); --glow1:rgba(255,190,60,.25); --glow2:rgba(80,200,90,.16);
  color-scheme:light;
}
body.patrac{
  --bg:#eff6ee; --bg2:#e2efe0; --card:#ffffff; --card2:#f4faf3;
  --line:rgba(20,60,30,.12); --line2:rgba(20,60,30,.22); --grid:rgba(20,60,30,.04);
  --text:#14261b; --mut:#587262; --acc:#16834a; --g1:#5fd66f; --g2:#14904d; --on:#ffffff;
  --ok:#15803d; --bad:#e11d48;
  --shadow:0 8px 24px rgba(20,60,30,.10); --glow1:rgba(80,200,110,.20); --glow2:rgba(56,225,214,.13);
  color-scheme:light;
}
body.expert{ --glow1:rgba(78,212,107,.12); --glow2:rgba(56,225,214,.10); }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0;padding:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.55;min-height:100vh;transition:background .4s,color .4s}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(720px 440px at 8% -6%,var(--glow1),transparent 70%),
    radial-gradient(620px 420px at 102% 12%,var(--glow2),transparent 70%),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px;}
body.expert:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.45))}
a{color:var(--acc)}
button{font:inherit}
.mono{font-family:var(--fm)}
.mut{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ====== Hlavička ====== */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 16px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);cursor:pointer;padding:0;min-height:44px;min-width:0}
.brand svg{width:34px;height:34px;flex:none;color:var(--acc)}
.brand b{font-family:var(--fm);font-size:12.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1;min-width:4px}
.lvtag{font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;border:1px solid var(--line2);background:var(--card);color:var(--mut);border-radius:999px;padding:6px 11px;min-height:36px;cursor:pointer;white-space:nowrap}
.ib{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{border-color:var(--acc)}
.ib svg{width:20px;height:20px}
@media(max-width:520px){.lvtag{display:none}.brand b{font-size:11px;letter-spacing:.14em}}

main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:16px 16px 64px}

/* ====== Základné prvky ====== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.btn{appearance:none;border:0;border-radius:999px;padding:12px 20px;min-height:46px;font:600 15px/1.2 var(--fh);color:var(--on);
  background:linear-gradient(135deg,var(--g1),var(--g2));cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 18px color-mix(in srgb,var(--g2) 32%,transparent);transition:transform .15s,filter .15s;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.ghost:hover{border-color:var(--acc)}
.btn.sm{min-height:42px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.4)}
.btn .i svg{width:17px;height:17px;display:block}
.eyebrow{font-family:var(--fm);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.note{color:var(--mut);font-size:14.5px;margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-family:var(--fm);font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);background:var(--card2)}
.chip b{color:var(--acc)}

/* ====== Domov ====== */
.hero{display:grid;padding:0;overflow:hidden}
.hero .scene{aspect-ratio:16/11;background:#0d2b40;position:relative;overflow:hidden}
.hero .scene svg{width:100%;height:100%;display:block}
.hero .txt{padding:22px 18px 24px}
.hero h1{font-family:var(--fh);font-weight:700;font-size:clamp(36px,9vw,62px);line-height:1.0;margin:.3em 0 .32em;letter-spacing:-.025em}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{margin:0;color:var(--mut);font-size:16.5px;max-width:52ch}
.hero .row{margin-top:18px}
@media(min-width:900px){.hero{grid-template-columns:1fr 1.05fr}.hero .scene{aspect-ratio:auto;min-height:440px;order:2}.hero .txt{padding:38px 34px;align-self:center}}

.sec{margin-top:38px}
.sech{margin:0 0 14px}
.sech .t{display:flex;align-items:baseline;gap:12px}
.sech .n{font-family:var(--fm);color:var(--acc);font-weight:700;font-size:14px}
.sech h2{margin:0;font-family:var(--fh);font-size:clamp(23px,4.6vw,31px);letter-spacing:-.01em;line-height:1.15}
.sech p{margin:4px 0 0;color:var(--mut)}

.lvgrid{display:grid;gap:12px}
@media(min-width:680px){.lvgrid{grid-template-columns:repeat(3,1fr)}}
.lv{position:relative;text-align:left;display:flex;gap:14px;align-items:center;cursor:pointer;color:var(--text);font:inherit;width:100%;transition:transform .15s,border-color .2s}
.lv:hover{transform:translateY(-2px);border-color:var(--line2)}
@media(min-width:680px){.lv{flex-direction:column;align-items:flex-start}}
.av{width:64px;height:64px;border-radius:18px;overflow:hidden;flex:none;background:var(--card2)}
.av svg{width:100%;height:100%;display:block}
.lv h3{margin:0;font-family:var(--fh);font-size:20px;line-height:1.2}
.lv .who{font-family:var(--fm);font-size:11.5px;letter-spacing:.06em;color:var(--acc);font-weight:600}
.lv p{margin:4px 0 0;color:var(--mut);font-size:14.5px}
.lv .g{font-size:13px}
.lv.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 38%,transparent),var(--shadow)}
.lv .tick{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--card);display:none;place-items:center}
.lv .tick svg{width:16px;height:16px}
.lv.on .tick{display:grid}

.prog{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.prog .bar{flex:1;margin:0}
.prog b{font-family:var(--fm);font-size:13px;white-space:nowrap}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:9px;transition:width .6s}

.map{position:relative;display:grid;gap:14px;padding-left:30px}
.map:before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:repeating-linear-gradient(var(--acc) 0 6px,transparent 6px 12px);opacity:.55}
.stop{position:relative}
.stop .dot{position:absolute;left:-30px;top:26px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--acc);display:grid;place-items:center;font-family:var(--fm);font-size:11px;font-weight:700;color:var(--acc)}
.stop.done .dot{background:var(--acc);color:var(--card)}
.stop>.card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;cursor:pointer;width:100%;text-align:left;color:var(--text);font:inherit;position:relative;overflow:hidden;transition:transform .15s,border-color .2s}
.stop>.card:hover{transform:translateX(3px);border-color:var(--line2)}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.ico svg{width:28px;height:28px}
.stop .no{font-family:var(--fm);font-size:11.5px;color:var(--mut);letter-spacing:.14em}
.stop h3{margin:2px 0 2px;font-size:20px;font-family:var(--fh);line-height:1.2}
.stop p{margin:0;color:var(--mut);font-size:14.5px}
.stamp{position:absolute;right:12px;top:12px;transform:rotate(-11deg);font-family:var(--fm);font-weight:700;font-size:10.5px;letter-spacing:.16em;color:var(--ok);border:2px solid var(--ok);border-radius:8px;padding:3px 7px;background:color-mix(in srgb,var(--card) 80%,transparent)}
.excard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.excard h3{margin:0 0 4px;font-family:var(--fh);font-size:21px}
.excard p{margin:0;color:var(--mut)}
.foot{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.foot p{margin:4px 0}

/* ====== Kapitola ====== */
.chhead{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.cht{min-width:0}
.chhead h2{margin:2px 0 0;font-family:var(--fh);font-size:clamp(23px,5vw,33px);line-height:1.1}
.ring{width:56px;height:56px;flex:none;margin-left:auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fm);font-size:12px}
.guide{display:flex;gap:14px;align-items:flex-start}
.bubble{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px 14px;flex:1;min-width:0}
.bubble:before{content:"";position:absolute;left:-7px;top:24px;width:12px;height:12px;background:var(--card2);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble .who{font-family:var(--fm);font-size:11.5px;letter-spacing:.14em;color:var(--acc);text-transform:uppercase;font-weight:700}
.bubble p{margin:4px 0 8px}
body.junior .bubble p{font-size:18px}
@media(max-width:420px){.guide .av{width:52px;height:52px}}
.pills{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;min-height:44px;font:500 14px var(--fh);display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.pill .k{font-family:var(--fm);font-size:12px;color:var(--mut)}
.pill .ck{color:var(--ok);font-weight:700}
.pill.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border-color:transparent}
.pill.on .k,.pill.on .ck{color:inherit}
.task{margin-top:8px}
.taskh{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.taskh h3{margin:2px 0 0;font-size:22px;font-family:var(--fh);line-height:1.2}
.taskh>.btn{margin-left:auto}
.q{font-size:17px;margin:10px 0 12px;font-weight:500}
body.junior .q{font-size:20px}
.q b,.note b{color:var(--acc)}
body.junior .q b{color:#c25e00}

/* ====== Odpovede a úlohy ====== */
.opts{display:grid;gap:10px}
@media(min-width:640px){.opts.c2{grid-template-columns:1fr 1fr}.opts.c4{grid-template-columns:repeat(4,1fr)}}
.opts.c4{grid-template-columns:repeat(3,1fr)}
.opt{text-align:left;border:1.5px solid var(--line2);background:var(--card2);color:var(--text);border-radius:16px;padding:12px 14px;min-height:50px;font:500 16px/1.35 var(--fb);cursor:pointer;transition:border-color .15s,background .15s}
.opts.c4 .opt{text-align:center;padding:10px 6px;font-size:14.5px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card2))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card2));opacity:.75}
body.junior .opt{min-height:60px;font-size:19px}
.fb{min-height:22px;margin-top:12px;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.reveal:not(:empty){margin-top:10px}
.win{margin-top:16px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--ok) 12%,var(--card2));border:1px solid color-mix(in srgb,var(--ok) 42%,transparent);animation:pop .35s}
.win h4{margin:0 0 6px;font-family:var(--fh);font-size:19px;color:var(--ok)}
.win p{margin:0 0 6px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.tile{border:2px solid var(--line2);background:var(--card2);border-radius:18px;padding:12px 8px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text);font:500 15px/1.2 var(--fb);text-align:center;transition:transform .12s,border-color .15s,background .15s}
.tile .em{font-size:38px;line-height:1}
.tile.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card2));transform:translateY(-2px)}
.tile.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card2))}
.tile.bad{border-color:var(--bad)}
.tile.dim{opacity:.38}
.tile:disabled{cursor:default}
body.junior .tile{font-size:17px}

.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:1.5px dashed var(--line2);border-radius:16px;margin-bottom:12px}
.pool:empty:before{content:attr(data-empty);color:var(--mut);font-size:14px;align-self:center}
.chipc{border:1.5px solid var(--line2);background:var(--card);color:var(--text);border-radius:12px;padding:8px 12px;min-height:44px;font:500 15px/1.25 var(--fb);cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-align:left;transition:border-color .15s,background .15s}
.chipc .em{font-size:20px;line-height:1}
.chipc.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.chipc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.chipc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.chipc.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));pointer-events:none}
.chipc:disabled{cursor:default}
body.junior .chipc{font-size:17px;min-height:50px}
.bins{display:grid;gap:10px}
@media(min-width:640px){.bins.n2{grid-template-columns:1fr 1fr}.bins.n3{grid-template-columns:repeat(3,1fr)}.bins.n4{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.bins.n4{grid-template-columns:repeat(4,1fr)}}
.bin{border:1.5px solid var(--line2);border-radius:16px;padding:10px;min-height:96px;background:color-mix(in srgb,var(--acc) 5%,var(--card2));cursor:pointer;transition:border-color .15s,box-shadow .15s}
.bins.hot .bin{border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 12%,transparent)}
.bin .bh{font-family:var(--fm);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:8px;font-weight:700}
.bin .bc{display:flex;flex-wrap:wrap;gap:6px}
.bins.strata{grid-template-columns:1fr!important;gap:0;border-radius:16px;overflow:hidden;border:1.5px solid var(--line2)}
.bins.strata .bin{border:0;border-radius:0;border-bottom:1px solid rgba(0,0,0,.25);min-height:82px;background:var(--sc);color:#fff}
.bins.strata .bin:last-child{border-bottom:0}
.bins.strata .bin .bh{color:#fff3d6}
.bins.strata .bin:nth-child(1){--sc:#7a5a3a}
.bins.strata .bin:nth-child(2){--sc:#8c6a45}
.bins.strata .bin:nth-child(3){--sc:#5d4a3a}
.bins.strata .bin:nth-child(4){--sc:#4a3a2e}
.bins.strata.hot .bin{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}

.ord{list-style:none;padding:10px;margin:0 0 12px;display:grid;gap:8px;min-height:56px;border:1.5px dashed var(--line2);border-radius:16px;counter-reset:o}
.ord:empty:before{content:"Sem poskladaj poradie – ťukaj na kartičky nižšie.";color:var(--mut);font-size:14px;align-self:center}
.ord li{counter-increment:o}
.ord li .chipc{width:100%}
.ord li .chipc:before{content:counter(o);font-family:var(--fm);font-weight:700;color:var(--acc);min-width:18px}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:8px;align-content:start}
.pairs .chipc{width:100%;min-height:54px;font-size:14.5px}
body.junior .pairs .chipc{font-size:16px}

.ask{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inp{font:600 18px var(--fm);padding:10px 14px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card2);color:var(--text);width:150px;min-height:48px}
.inp:focus{outline:none;border-color:var(--acc)}
.unit{font-family:var(--fm);color:var(--mut)}

.sim{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:10px;margin:8px 0 12px;color:var(--text)}
.sim svg{width:100%;height:auto;display:block}
.sim.narrow svg{max-width:420px;margin:0 auto}
.ctl{display:grid;gap:12px;margin:12px 0}
@media(min-width:640px){.ctl.c3{grid-template-columns:repeat(3,1fr)}}

.tg b{font-family:var(--fm)}

table.data{width:100%;border-collapse:collapse;font-family:var(--fm);font-size:13px}
table.data th,table.data td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

.tf{display:grid;gap:8px}
.tfr{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 12px;border:1.5px solid var(--line2);border-radius:14px;background:var(--card2)}
@media(min-width:640px){.tfr{grid-template-columns:1fr auto;align-items:center}}
.tfr .tg{min-width:86px}
.tfr.ok{border-color:var(--ok)} .tfr.bad{border-color:var(--bad)}
.tfr small{grid-column:1/-1;color:var(--mut);font-size:13.5px}

.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;margin:10px 0 14px}
.slot{min-width:104px;min-height:48px;border:2px dashed var(--line2);border-radius:12px;display:grid;place-items:center;padding:6px 10px;font:600 15px var(--fm);cursor:pointer;background:var(--card2);color:var(--mut)}
.slot.f{border-style:solid;border-color:var(--acc);color:var(--text)}
.slot.bad{border-color:var(--bad)} .slot.ok{border-color:var(--ok)}

.fac-out{align-items:flex-end}
.fac-chip{font-size:15px;padding:6px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line2);animation:pop .35s}

@media(max-width:480px){.fac{grid-template-columns:1fr;justify-items:center}.fac-in,.fac-out{flex-direction:row;flex-wrap:wrap;justify-content:center}.fac-leaf{order:-1}}

details.ex{margin:10px 0 4px;border:1px dashed var(--line2);border-radius:14px;padding:8px 14px;background:var(--card2)}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--fm);font-size:12.5px;color:var(--mut);letter-spacing:.06em}

.bigstamp{display:inline-block;font-family:var(--fm);font-weight:700;letter-spacing:.2em;font-size:22px;color:var(--ok);border:3px solid var(--ok);border-radius:12px;padding:8px 16px;transform:rotate(-10deg);animation:stampin .55s cubic-bezier(.2,1.4,.4,1);margin:12px 0}
.clue{margin:14px auto 0;max-width:560px;text-align:left;padding:14px 16px;border-radius:16px;border:1px dashed var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card2))}

.done-box .row{justify-content:center}
.rules{margin:10px 0 0;padding-left:20px}

.areas{display:grid;gap:8px;margin:14px 0}

/* ====== Spodný panel, úvod, toast ====== */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}

.term{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--acc);text-underline-offset:3px;text-decoration-thickness:2px}

.gsearch{width:100%;font:500 16px var(--fb);padding:10px 14px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card2);color:var(--text);margin:6px 0 4px;min-height:46px}

.intro{position:fixed;inset:0;z-index:60;background:radial-gradient(900px 560px at 50% 42%,#123323,#030806);color:#eaf7ee;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;transition:opacity .4s;overflow:hidden}
.intro.on{opacity:1}
.intro[hidden]{display:none}
.inum{font-family:var(--fm);font-weight:700;font-size:clamp(150px,40vw,320px);line-height:.9;color:transparent;-webkit-text-stroke:2px rgba(214,247,79,.5);position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);pointer-events:none;opacity:.45;letter-spacing:-.04em}
.ieb{position:relative;font-family:var(--fm);font-size:12px;letter-spacing:.24em;color:#d6f74f;text-transform:uppercase;margin-bottom:14px;opacity:0;animation:sharp .7s .1s forwards}
.ilines{position:relative;display:grid;gap:12px;max-width:680px}
.ln{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(21px,4.8vw,32px);font-weight:600;line-height:1.2;opacity:0;filter:blur(12px);transform:translateY(8px);animation:sharp .9s forwards}
.ilearn{position:relative;margin:22px 0 0;max-width:560px;font-size:16px;color:#b9d6c4;opacity:0;animation:sharp .8s forwards}
.intro .go{position:relative;margin-top:24px;opacity:0;animation:sharp .6s forwards}
.iskip{position:absolute;top:14px;right:14px;background:none;border:1px solid rgba(255,255,255,.25);color:#cfe9d8;border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer;font:500 14px 'Space Grotesk',sans-serif}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);z-index:70;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:all .3s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ====== Hero animácie ====== */
.h-crown{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
.h-rays{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
.h-smoke{transform-box:fill-box;transform-origin:center;animation:smoke 4.5s ease-out infinite;opacity:0}
.h-co2{animation:drift 10s ease-in-out infinite}
.h-twinkle{animation:twinkle 3s ease-in-out infinite}

@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.shake{animation:shake .45s}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes stampin{from{transform:rotate(-10deg) scale(2.2);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
@keyframes sharp{to{opacity:1;filter:none;transform:none}}
@keyframes growIn{from{transform:scaleY(.05);opacity:.3}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(0);opacity:.95}to{transform:translateY(-78px);opacity:0}}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
@keyframes blink{0%,100%{filter:none}40%{filter:drop-shadow(0 0 7px #fb7185) drop-shadow(0 0 2px #fb7185)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,214,90,0))}50%{filter:drop-shadow(0 0 14px rgba(255,214,90,.9))}}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.75}100%{transform:translate(-34px,-80px) scale(1.7);opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,10px)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media print{
  body{background:#fff!important;color:#111!important}
  body:before,body:after,.top,.shade,.sheet,#toast,.noprint{display:none!important}
  main>*{display:none!important}
  main>#certwrap{display:block!important}
  #certwrap .row{display:none!important}
  .cert{box-shadow:none!important;border:2px solid #333!important;color:#111!important;background:#fff!important}
  .cert .nm{color:#16834a!important}
}

<body>

  <button class="brand" id="brand" aria-label="Zelený stroj času – domov"></button>
  <span class="sp"></span>
  <button class="lvtag" id="lvtag" hidden></button>
  <button class="ib" id="gbtn" aria-label="Slovník pojmov" title="Slovník pojmov"></button>
  <button class="ib" id="sbtn" aria-label="Zvuk" title="Zvuk"></button>
</header>
<main id="app"></main>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Slovník"></div>
<div class="intro" id="intro" hidden role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   ZELENÝ STROJ ČASU – appka pre Zavretú školu
   Autor: Miroslav Sopko · biológia podľa ŠVP 2023
   ========================================================= */

/* ---------- Pomocníci ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rndf = (a, b, d = 1) => +(a + Math.random() * (b - a)).toFixed(d);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sample = (a, n) => shuffle(a).slice(0, n);
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const num = s => parseFloat(String(s).replace(/[\s ]/g, '').replace(',', '.'));
const fmt = (x, d = 1) => Number(x).toLocaleString('sk-SK', { maximumFractionDigits: d, minimumFractionDigits: 0 });
const pad = n => String(n).padStart(2, '0');
const plural = (n, a, b, c) => { n = Math.abs(n); return n === 1 ? a : (n >= 2 && n <= 4 ? b : c); };
let UID = 0; const uid = p => (p || 'u') + (++UID);
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  if (tag === 'button' && !(attrs && attrs.type)) e.type = 'button';
  return e;
}
const P_ = t => el('p', { class: 'q' }, rich(t));

/* ---------- Ukladanie postupu ---------- */
const KEY = 'zeleny-stroj-casu-v1';
let S = { lv: null, sound: true, name: '', p: {}, ex: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function prog(lv, no) { S.p[lv] = S.p[lv] || {}; return S.p[lv][no] = S.p[lv][no] || { t: [], q: null }; }

/* ---------- Zvuk a čítanie ---------- */
let AC;
function beep(ok) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, notes = ok ? [660, 990] : [240, 190];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f;
      const s = t + i * .09;
      g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(ok ? .13 : .09, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + .17);
      o.connect(g).connect(AC.destination); o.start(s); o.stop(s + .19);
    });
  } catch (e) { }
}
const plain = t => String(t).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a).replace(/\*\*/g, '');
function speak(text) {
  try {
    const s = window.speechSynthesis; if (!s) { toast('Čítanie nahlas tento prehliadač nepodporuje.'); return; }
    s.cancel(); const u = new SpeechSynthesisUtterance(plain(text)); u.lang = 'sk-SK';
    const v = s.getVoices().find(v => /^sk/i.test(v.lang)); if (v) u.voice = v;
    u.rate = S.lv === 'junior' ? .9 : 1; s.speak(u);
  } catch (e) { }
}
function stopSpeech() { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { } }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- Text so slovníkom: [[pojem]] alebo [[pojem|tvar]], **tučné** ---------- */
function rich(t) {
  const f = document.createDocumentFragment(); let b = null;
  String(t).split(/(\[\[[^\]]+\]\]|\*\*)/).forEach(part => {
    if (!part) return;
    if (part === '**') { if (b) b = null; else { b = el('b'); f.append(b); } return; }
    const m = part.match(/^\[\[([^\]|]+)(?:\|([^\]]+))?\]\]$/);
    const node = m ? el('button', { class: 'term', onclick: e => { e.stopPropagation(); openTerm(m[1].trim()); } }, m[2] || m[1]) : document.createTextNode(part);
    (b || f).append(node);
  });
  return f;
}

/* ---------- Spodný panel (slovník) ---------- */
function openSheet(...kids) {
  const sh = $('#sheet');
  sh.replaceChildren(el('div', { class: 'grab' }), ...kids);
  sh.classList.add('on'); $('#shade').classList.add('on'); sh.scrollTop = 0;
}
function closeSheet() { $('#sheet').classList.remove('on'); $('#shade').classList.remove('on'); }
const GI = {}; // index pojmov bez diakritiky
function openTerm(k) {
  const key = GI[norm(k)];
  if (!key) { toast('Pojem „' + k + '“ v slovníku nie je.'); return; }
  openSheet(
    el('div', { class: 'sh' }, el('div', { class: 'eyebrow' }, 'Slovník'), el('span', { style: { flex: 1 } }), el('button', { class: 'ib', 'aria-label': 'Zavrieť', html: ic('x'), onclick: closeSheet })),
    el('h3', { style: { margin: '2px 0 4px', fontFamily: 'var(--fh)', fontSize: '24px' } }, key),
    el('p', null, rich(G[key])),
    el('div', { class: 'row' },
      el('button', { class: 'btn ghost sm', onclick: () => speak(key + '. ' + G[key]) }, el('span', { class: 'i', html: ic('sound') }), 'Prečítať'),
      el('button', { class: 'btn ghost sm', onclick: openGlossary }, el('span', { class: 'i', html: ic('book') }), 'Celý slovník'))
  );
}
function openGlossary() {
  const keys = Object.keys(G).sort((a, b) => a.localeCompare(b, 'sk'));
  const list = el('div', { class: 'glist' });
  const draw = q => {
    list.replaceChildren(...keys.filter(k => !q || norm(k).includes(norm(q)) || norm(G[k]).includes(norm(q)))
      .map(k => el('details', null, el('summary', null, k), el('p', null, rich(G[k])))));
    if (!list.children.length) list.append(el('p', { class: 'mut' }, 'Nič sa nenašlo.'));
  };
  const s = el('input', { class: 'gsearch', type: 'search', placeholder: 'Hľadaj pojem…', 'aria-label': 'Hľadaj pojem' });
  s.addEventListener('input', () => draw(s.value));
  draw('');
  openSheet(
    el('div', { class: 'sh' }, el('h3', null, `Slovník · ${keys.length} pojmov`), el('button', { class: 'ib', 'aria-label': 'Zavrieť', html: ic('x'), onclick: closeSheet })),
    el('p', { class: 'mut', style: { fontSize: '14px' } }, 'Bodkovane podčiarknuté slová v texte sa dajú ťuknúť.'),
    s, list);
}

/* ---------- Spätná väzba a nápovede ---------- */
const OKS = ['Správne!', 'Presne tak!', 'Výborne!', 'Sedí!', 'Super!'];
const BADS = ['Ešte nie. Skús inú možnosť.', 'Tadiaľ cesta nevedie. Skús znova.', 'Nie celkom. Prečítaj si zadanie ešte raz.'];
function shake(n) { if (!n) return; n.classList.remove('shake'); void n.getBoundingClientRect(); n.classList.add('shake'); }
function fbox(box) {
  const f = el('div', { class: 'fb', role: 'status', 'aria-live': 'polite' }); box.append(f);
  return {
    el: f,
    ok(m) { f.className = 'fb ok'; f.replaceChildren(rich('✔ ' + m)); beep(true); },
    bad(m, sh) { f.className = 'fb bad'; f.replaceChildren(rich('✘ ' + m)); beep(false); shake(sh || f); },

// Po 3 chybách ponúkne tlačidlo „Ukáž riešenie“
function tries(box, reveal) {

// Triedenie kartičiek do skupín (ťukni kartičku → ťukni skupinu)
function sorter(box, { q, bins, items, why, strata }, cb) {
  if (q) box.append(P_(q));
  const pool = el('div', { class: 'pool', 'data-empty': 'Všetko je roztriedené. Stlač Skontrolovať.' });
  const bw = el('div', { class: 'bins n' + bins.length + (strata ? ' strata' : '') });
  box.append(pool, bw);
  let sel = null, fin = false;
  const setSel = c => { if (sel) sel.classList.remove('sel'); sel = c; if (c) c.classList.add('sel'); bw.classList.toggle('hot', !!c); };
  const cards = items.map(it => {
    const c = el('button', { class: 'chipc' }, it.e ? el('span', { class: 'em', 'aria-hidden': 'true' }, it.e) : null, el('span', null, rich(it.t)));
    c._it = it; c._b = -1;
    c.onclick = ev => {
      ev.stopPropagation(); if (fin) return; c.classList.remove('bad');
      if (c._b >= 0) { c._b = -1; pool.append(c); setSel(null); upd(); return; }
      setSel(sel === c ? null : c);

  });
  shuffle(cards).forEach(c => pool.append(c));
  const bEls = bins.map((b, i) => {
    const bc = el('div', { class: 'bc' });
    const be = el('div', { class: 'bin', role: 'button', tabindex: '0', 'aria-label': 'Skupina ' + plain(b) }, el('div', { class: 'bh' }, rich(b)), bc);
    const put = () => { if (fin) return; if (!sel) { F.info('Najprv ťukni na kartičku, potom na skupinu.'); return; } sel._b = i; bc.append(sel); setSel(null); upd(); };
    be.addEventListener('click', put);
    be.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); put(); } });
    bw.append(be); return bc;
  });
  const chk = el('button', { class: 'btn', onclick: check, disabled: true }, 'Skontrolovať'); box.append(el('div', { class: 'row' }, chk));
  const F = fbox(box);
  F.info('Ťukni na kartičku a potom na skupinu, kam patrí.');
  const R = tries(box, () => { fin = true; setSel(null); cards.forEach(c => { c.classList.remove('bad', 'sel'); c._b = c._it.b; bEls[c._it.b].append(c); c.classList.add('ok'); c.disabled = true; }); chk.disabled = true; F.info('Takto je to správne.'); cb(why, true); });
  function upd() { chk.disabled = cards.some(c => c._b < 0); }
  function check() {
    if (fin) return;
    const wrong = cards.filter(c => c._b !== c._it.b);
    if (!wrong.length) { fin = true; cards.forEach(c => { c.classList.add('ok'); c.disabled = true; }); chk.disabled = true; R.hide(); F.ok(pick(OKS)); cb(why); return; }
    wrong.forEach(c => { c.classList.add('bad'); shake(c); });
    F.bad(`${wrong.length} ${plural(wrong.length, 'kartička je', 'kartičky sú', 'kartičiek je')} v nesprávnej skupine – ${plural(wrong.length, 'vráti', 'vrátia', 'vrátia')} sa späť.`);
    chk.disabled = true;
    setTimeout(() => { if (fin) return; wrong.forEach(c => { c._b = -1; c.classList.remove('bad'); pool.append(c); }); upd(); }, 1000);

  }

// Zoradenie (ťukaním sa kartičky skladajú do poradia)

// Spájanie dvojíc
function pairs(box, { q, pairs: PR, why }, cb) {
  if (q) box.append(P_(q));
  const L = el('div', { class: 'col' }), Rc = el('div', { class: 'col' });
  box.append(el('div', { class: 'pairs' }, L, Rc));
  let sL = null, sR = null, left = PR.length, fin = false;
  const mk = (t, i, side) => { const c = el('button', { class: 'chipc' }, rich(t)); c._i = i; c._s = side; c.onclick = () => choose(c); return c; };
  const ls = shuffle(PR.map((p, i) => mk(p[0], i, 'L'))), rs = shuffle(PR.map((p, i) => mk(p[1], i, 'R')));
  ls.forEach(c => L.append(c)); rs.forEach(c => Rc.append(c));
  const F = fbox(box);
  F.info('Ťukni na položku vľavo a potom na to, čo k nej patrí vpravo.');
  const R = tries(box, () => {
    fin = true;
    Rc.replaceChildren(...ls.map(l => rs.find(r => r._i === l._i)));
    [...ls, ...rs].forEach(c => { c.classList.remove('sel', 'bad'); c.classList.add('done'); });
    F.info('Správne dvojice sú teraz vedľa seba.'); cb(why, true);
  });
  function choose(c) {
    if (fin || c.classList.contains('done')) return;
    if (c._s === 'L') { if (sL) sL.classList.remove('sel'); sL = sL === c ? null : c; if (sL) sL.classList.add('sel'); }
    else { if (sR) sR.classList.remove('sel'); sR = sR === c ? null : c; if (sR) sR.classList.add('sel'); }
    if (sL && sR) {
      if (sL._i === sR._i) {
        [sL, sR].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); }); left--; sL = sR = null;
        if (!left) { fin = true; R.hide(); F.ok(pick(OKS)); cb(why); } else { beep(true); F.info(`Dvojica sedí! Zostáva ${left}.`); }
      } else {
        const a = sL, b = sR; [a, b].forEach(x => { x.classList.add('bad'); shake(x); });
        F.bad('Toto k sebe nepatrí.'); R.miss();
        setTimeout(() => [a, b].forEach(x => x.classList.remove('bad', 'sel')), 600); sL = sR = null;
      }
    }
  }
}

// Číselná odpoveď
function ask(box, { q, ans, tol = 0, rel, unit, hint, why, show, note }, cb) {
  if (q) box.append(P_(q));

  const go = el('button', { class: 'btn', onclick: check }, 'Overiť');
  box.append(el('div', { class: 'ask' }, inp, unit ? el('span', { class: 'unit' }, unit) : null, go));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  const F = fbox(box); let fin = false;

  const R = tries(box, () => { fin = true; inp.value = shown; inp.disabled = true; go.disabled = true; F.info(`Správne je **${shown}${unit ? ' ' + unit : ''}**.`); cb(why, true); });

// Rovnica s okienkami: ľavá strana → pravá strana
function equation(box, { q, left, right, mid, tail, tiles, why }, cb) {
  if (q) box.append(P_(q));
  const slots = [0, 1, 2, 3].map(i => el('button', { class: 'slot', 'aria-label': 'Okienko ' + (i + 1) }, '?'));
  box.append(el('div', { class: 'eq' }, slots[0], el('span', { class: 'op' }, '+'), slots[1],
    el('span', { class: 'arrow' }, el('span', null, mid || ' '), el('span', null, '⟶')),
    slots[2], el('span', { class: 'op' }, '+'), slots[3], tail ? el('span', { class: 'op' }, '+ ' + tail) : null));
  const pool = el('div', { class: 'pool', 'data-empty': 'Všetky okienka sú plné.' }); box.append(pool);
  let fin = false;
  const tl = shuffle(tiles).map(t => {
    const c = el('button', { class: 'chipc' }, t); c._t = t;
    c.onclick = () => { if (fin) return; const s = slots.find(s => !s._c); if (!s) return; s._c = c; s.textContent = t; s.classList.add('f'); s.classList.remove('bad'); c.remove(); upd(); };
    pool.append(c); return c;
  });
  slots.forEach(s => s.onclick = () => { if (fin || !s._c) return; pool.append(s._c); s._c = null; s.textContent = '?'; s.classList.remove('f', 'bad'); upd(); });
  const chk = el('button', { class: 'btn', onclick: check, disabled: true }, 'Skontrolovať'); box.append(el('div', { class: 'row' }, chk));
  const F = fbox(box);
  F.info('Ťukni na kartičku – zaradí sa do prvého voľného okienka. Ťuknutím na okienko ju vrátiš.');
  const fill = arr => arr.forEach((t, i) => { const s = slots[i]; s._c = tl.find(c => c._t === t); s.textContent = t; s.classList.add('f'); });
  const R = tries(box, () => { fin = true; slots.forEach(s => { s._c = null; s.classList.remove('bad'); }); fill([...left, ...right]); slots.forEach(s => s.classList.add('ok')); pool.replaceChildren(); chk.disabled = true; F.info('Takto vyzerá správna rovnica.'); cb(why, true); });
  function upd() { chk.disabled = slots.some(s => !s._c); }
  function check() {
    if (fin) return;
    const v = slots.map(s => s._c._t);
    const bad = v.map((t, i) => i < 2 ? !left.includes(t) : !right.includes(t));
    if (!bad.some(Boolean)) { fin = true; slots.forEach(s => s.classList.add('ok')); chk.disabled = true; R.hide(); F.ok(pick(OKS)); cb(why); return; }

    F.bad('Červené okienka nesedia. Čo do deja vstupuje a čo z neho vychádza?'); R.miss();
  }
}

// Určovací kľúč (otázky áno/nie)
function dkey(box, { nodes, start, org, why }, cb) {
  const groupsOf = t => typeof t === 'string' ? [...groupsOf(nodes[t].yes), ...groupsOf(nodes[t].no)] : [t.g];
  box.append(el('div', { class: 'org' }, el('span', { class: 'em', 'aria-hidden': 'true' }, org.e || '🌿'), el('div', null, el('h4', null, org.n), el('p', null, rich(org.d)))));
  const path = el('div', { class: 'kpath' }), qa = el('div'); box.append(path, qa);
  const F = fbox(box); let cur = start, steps = 0, fin = false;
  const R = tries(box, () => {
    fin = true; restart(true); let c = start;
    while (typeof c === 'string') { const nd = nodes[c]; const y = groupsOf(nd.yes).includes(org.g); line(nd.q, y); c = y ? nd.yes : nd.no; }
    qa.replaceChildren(); F.info(`Správna cesta kľúčom vedie ku skupine **${org.g}**.`); cb(why || org.w, true);
  });
  function line(qt, y) { path.append(el('div', null, '→ ', rich(qt), ' ', el('b', null, y ? 'áno' : 'nie'))); }
  function show() {
    const nd = nodes[cur];
    qa.replaceChildren(el('p', { class: 'kq' }, el('span', { class: 'mono mut' }, `${steps + 1}. `), rich(nd.q)),
      el('div', { class: 'row', style: { marginTop: '6px' } }, el('button', { class: 'btn sm', onclick: () => ans(true) }, 'Áno'), el('button', { class: 'btn ghost sm', onclick: () => ans(false) }, 'Nie')));
  }
  function ans(y) {
    if (fin) return; const nd = nodes[cur]; steps++; line(nd.q, y);
    const t = y ? nd.yes : nd.no;
    if (typeof t === 'string') { cur = t; show(); } else finish(t.g);
  }
  function finish(g) {
    qa.replaceChildren();
    if (g === org.g) { fin = true; R.hide(); F.ok(`Určené! ${org.n} patrí medzi **${g}**.`); cb(why || org.w); }
    else { F.bad(`Kľúč ťa doviedol ku skupine **${g}**, ale to nesedí. Prečítaj si opis ešte raz.`); R.miss(); qa.append(el('div', { class: 'row' }, el('button', { class: 'btn ghost sm', onclick: () => restart() }, '↺ Prejsť kľúčom znova'))); }
  }
  function restart(silent) { cur = start; steps = 0; path.replaceChildren(); if (!silent) { F.clear(); show(); } }
  show();
}

// Šípka do SVG
function arrowSVG(x1, y1, x2, y2, c, w = 5) {
  const a = Math.atan2(y2 - y1, x2 - x1), h = w * 2.6;
  const p1 = [x2 - h * Math.cos(a - .45), y2 - h * Math.sin(a - .45)], p2 = [x2 - h * Math.cos(a + .45), y2 - h * Math.sin(a + .45)];
  const xe = x2 - h * .8 * Math.cos(a), ye = y2 - h * .8 * Math.sin(a);
  return `<line x1="${x1}" y1="${y1}" x2="${xe.toFixed(1)}" y2="${ye.toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${c}"/>`;
}

function elodeaLab(box, o) {

  const COL = { biele: ['#fff6c8', 1], 'červené': ['#ff7a7a', .9], 'modré': ['#7b95ff', .75], 'zelené': ['#6be08a', .3] };

  <defs><linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9ff" stop-opacity=".45"/><stop offset="1" stop-color="#6cbbe6" stop-opacity=".7"/></linearGradient></defs>
  <line x1="6" y1="200" x2="354" y2="200" stroke="currentColor" stroke-opacity=".3" stroke-width="2"/>
  <polygon class="beam" points="0,0" fill="#fff6c8" opacity=".3"/>
  <g class="lamp"><rect x="-4" y="150" width="8" height="50" fill="#8a8f98"/><rect x="-14" y="196" width="28" height="5" rx="2" fill="#6b717b"/><path d="M-22 118h44l-8 30h-28z" fill="#5b6370"/><circle class="bulb" cx="0" cy="130" r="9" fill="#fff6c8"/></g>
  <path d="M244 52v140q0 7 7 7h76q7 0 7-7V52" fill="url(#${id}w)" stroke="#9fc7d8" stroke-width="2.5"/>
  ${stems}
  <g class="bub"></g>
  <text class="tt" x="330" y="70" text-anchor="end" font-size="11" fill="currentColor" font-family="JetBrains Mono">25 °C</text>
  <text class="tc" x="249" y="70" font-size="11" fill="currentColor" font-family="JetBrains Mono">CO₂ 1 %</text>
  <g font-family="JetBrains Mono" font-size="12" fill="currentColor"><line class="dl" x1="0" y1="104" x2="244" y2="104" stroke="currentColor" stroke-opacity=".55" stroke-dasharray="4 4"/><text class="dt" x="0" y="98" text-anchor="middle">30 cm</text></g>
 </svg>`});

  function draw() {
    const x = 240 - st.d * 3.7; lamp.setAttribute('transform', `translate(${x} 0)`);
    beam.setAttribute('points', `${x + 8},122 ${x + 8},138 244,190 244,80`);
    beam.setAttribute('fill', COL[st.col][0]); beam.setAttribute('opacity', (.08 + .5 * fL(st)).toFixed(2));
    $('.bulb', svg).setAttribute('fill', COL[st.col][0]);
    $('.dl', svg).setAttribute('x1', x + 22); $('.dt', svg).setAttribute('x', ((x + 22 + 244) / 2).toFixed(0)); $('.dt', svg).textContent = st.d + ' cm';
    $('.tt', svg).textContent = st.T + ' °C'; $('.tc', svg).textContent = 'CO₂ ' + fmt(st.c, 1) + ' %';
    $('.tt', svg).style.display = o.vars.includes('T') ? '' : 'none'; $('.tc', svg).style.display = o.vars.includes('c') ? '' : 'none';
  }

    ctl.append(el('div', null, el('div', { class: 'note', style: { margin: '0 0 6px' } }, '🎨 Farebný filter na lampe'), tg));
  }
  box.append(ctl);
  const cols = [...o.vars.map(v => ({ d: 'Lampa', c: 'CO₂', T: 'Teplota', col: 'Svetlo' })[v]), 'Bublín/min'];
  const tb = el('tbody'); const tw = el('div', { class: 'tablewrap', hidden: true }, el('table', { class: 'data' }, el('thead', null, el('tr', null, cols.map(c => el('th', null, c)))), tb));
  const meter = el('span', { class: 'meter' });
  const mb = el('button', { class: 'btn', onclick: () => measure() }, '⏱ Zmeraj bubliny za 1 minútu');
  box.append(el('div', { class: 'row' }, mb, meter), tw);
  function record(s) {
    const n = Math.max(0, Math.round(rate(s) + (Math.random() * 2 - 1) * 1.2));
    const r = { d: s.d, c: s.c, T: s.T, col: s.col, n }; rows.push(r);
    tb.append(el('tr', null, o.vars.map(v => el('td', null, v === 'd' ? r.d + ' cm' : v === 'c' ? fmt(r.c, 1) + ' %' : v === 'T' ? r.T + ' °C' : r.col), el('td', null, el('b', null, r.n)))));
    tw.hidden = false; if (o.onRow) o.onRow(rows); return r;
  }
  function measure() {
    mb.disabled = true; let k = 0; const snap = { ...st };
    const t = setInterval(() => { k++; meter.textContent = '⏳ meriam… ' + '▮'.repeat(k); if (k >= 5) { clearInterval(t); meter.textContent = ''; mb.disabled = false; const r = record(snap); meter.textContent = `→ ${r.n} ${plural(r.n, 'bublina', 'bubliny', 'bublín')}`; } }, RM ? 20 : 220);
  }
  draw();
  return { rows, st, record, rate };
}

// Molekula CO₂: kruhy C a O s hmotnosťou
function molSVG(list, big) {
  const R = { C: 22, O: 18 }, col = { C: '#2f343b', O: '#e0675a' };
  let x = 30, s = '';
  list.forEach((a, i) => { const r = R[a]; x += r; s += `<circle cx="${x}" cy="60" r="${r}" fill="${col[a]}" stroke="#fff" stroke-width="2"/><text x="${x}" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">${a}</text><text x="${x}" y="72" text-anchor="middle" font-size="11" fill="#fff">${a === 'C' ? 12 : 16}</text>`; x += r - (i < list.length - 1 ? 6 : 0); });
  const sum = list.reduce((t, a) => t + (a === 'C' ? 12 : 16), 0);
  return `<svg viewBox="0 0 ${big ? 360 : 300} 130" role="img" aria-label="Váha s atómami, spolu ${sum}" font-family="JetBrains Mono">
  <rect x="10" y="96" width="${(big ? 340 : 280)}" height="8" rx="4" fill="currentColor" opacity=".35"/><path d="M${big ? 180 : 150} 104l-14 20h28z" fill="currentColor" opacity=".35"/>${s}
  <text x="${big ? 350 : 290}" y="30" text-anchor="end" font-size="16" font-weight="700" fill="currentColor">${list.length ? 'spolu ' + sum : 'váha je prázdna'}</text></svg>`;
}
function molBuilder(box, cb) {
  let atoms = [], fin = false;
  const sim = el('div', { class: 'sim narrow', html: molSVG([]) }); box.append(sim);
  const F = fbox(box);
  const add = a => { if (fin || atoms.length >= 4) return; atoms.push(a); sim.innerHTML = molSVG(atoms); };
  box.insertBefore(el('div', { class: 'tog' },
    el('button', { class: 'tg', onclick: () => add('C') }, '⚫ + uhlík C (12)'),
    el('button', { class: 'tg', onclick: () => add('O') }, '🔴 + kyslík O (16)'),
    el('button', { class: 'tg', onclick: () => { if (!fin) { atoms = []; sim.innerHTML = molSVG([]); F.clear(); } } }, '↺ Vyprázdniť')), F.el);
  const go = el('button', { class: 'btn sm' }, '✔ Toto je CO₂'); box.insertBefore(el('div', { class: 'row' }, go), F.el);
  const R = tries(box, () => { fin = true; atoms = ['O', 'C', 'O']; sim.innerHTML = molSVG(atoms); F.info('CO₂ = 1 uhlík + 2 kyslíky = 12 + 16 + 16 = **44**.'); cb(); });
  go.onclick = () => {
    if (fin) return; const c = atoms.filter(a => a === 'C').length, o = atoms.length - c;
    if (c === 1 && o === 2) { fin = true; R.hide(); atoms = ['O', 'C', 'O']; sim.innerHTML = molSVG(atoms); F.ok('Molekula CO₂ = 12 + 16 + 16 = **44**.'); cb(); }
    else { F.bad('Vzorec CO₂ hovorí: **1** atóm uhlíka (C) a **2** atómy kyslíka (O₂).'); R.miss(); }
  };
}
// „Balíček“: 12 kg uhlíka + 32 kg kyslíka = 44 kg CO₂

  <text x="90" y="58" text-anchor="middle" font-size="22" fill="currentColor">+</text>
  <circle cx="128" cy="52" r="20" fill="#e0675a"/><circle cx="168" cy="52" r="20" fill="#e0675a"/><text x="128" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">O</text><text x="168" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">O</text><text x="148" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">32 ${unit} zo vzduchu</text>
  <text x="208" y="58" text-anchor="middle" font-size="22" fill="currentColor">=</text>
  <circle cx="246" cy="52" r="17" fill="#e0675a"/><circle cx="314" cy="52" r="17" fill="#e0675a"/><circle cx="280" cy="52" r="21" fill="#2f343b" stroke="#fff" stroke-width="2"/><text x="280" y="57" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CO₂</text><text x="280" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#ffb020">44 ${unit}</text></svg>`;

// k balíčkov ako mriežka molekúl
function packsSVG(k, unit) {
  const show = Math.min(k, 40), cols = 10, rows = Math.ceil(show / cols);
  let s = '';
  for (let i = 0; i < show; i++) { const x = 22 + (i % cols) * 34, y = 22 + Math.floor(i / cols) * 30; s += `<g transform="translate(${x} ${y})"><circle cx="-9" r="6" fill="#e0675a"/><circle cx="9" r="6" fill="#e0675a"/><circle r="8" fill="#2f343b"/></g>`; }
  const h = rows * 30 + 34;
  return `<svg viewBox="0 0 360 ${h}" role="img" aria-label="${k} balíčkov CO₂" font-family="JetBrains Mono">${s}<text x="350" y="${h - 8}" text-anchor="end" font-size="13" font-weight="700" fill="currentColor">${k > show ? `… a ďalšie, spolu ${k}` : `spolu ${k}`} × 44 ${unit}</text></svg>`;
}

T.p2c = {
  n: 'Rastlina v uzavretej nádobe', run(box, done) {
    const sr = pick([5, 6, 7]), ss = pick([18, 19, 20]), Rr = 18, Pm = rnd(52, 62);
    let C = rnd(430, 470); const pts = [];
    for (let t = 0; t <= 24.001; t += .25) { pts.push([t, C]); const P = (t > sr && t < ss) ? Pm * Math.sin(Math.PI * (t - sr) / (ss - sr)) : 0; C += (Rr - P) * .25; }
    const ys = pts.map(p => p[1]); const y0 = Math.floor((Math.min(...ys) - 25) / 50) * 50, y1 = Math.ceil((Math.max(...ys) + 25) / 50) * 50;
    const hMax = Math.round(pts[ys.indexOf(Math.max(...ys))][0]), hMin = Math.round(pts[ys.indexOf(Math.min(...ys))][0]);
    const W = 360, H = 220, l = 46, r = 12, t0 = 14, b = 32;
    const X = t => l + t / 24 * (W - l - r), Y = c => t0 + (y1 - c) / (y1 - y0) * (H - t0 - b);
    let g = `<rect x="${X(0)}" y="${t0}" width="${X(sr) - X(0)}" height="${H - t0 - b}" fill="#3b4a8a" opacity=".18"/><rect x="${X(ss)}" y="${t0}" width="${X(24) - X(ss)}" height="${H - t0 - b}" fill="#3b4a8a" opacity=".18"/>`;
    for (let c = y0; c <= y1; c += 50) g += `<line x1="${l}" x2="${W - r}" y1="${Y(c)}" y2="${Y(c)}" stroke="currentColor" stroke-opacity=".12"/><text x="${l - 6}" y="${Y(c) + 4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".7">${c}</text>`;
    for (let h = 0; h <= 24; h += 3) g += `<text x="${X(h)}" y="${H - 14}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">${h}:00</text>`;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
    box.append(P_(`Rastlinu sme zatvorili do sklenenej nádoby so senzorom oxidu uhličitého. Slnko vychádza o **${sr}:00** a zapadá o **${ss}:00**. Spusti meranie na 24 hodín.`));
    const sim = el('div', {
      class: 'sim', html: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf koncentrácie oxidu uhličitého v nádobe počas dňa" font-family="JetBrains Mono">${g}
      <text x="${l}" y="10" font-size="10" fill="currentColor" opacity=".8">CO₂ (ppm)</text><text x="${W - r}" y="${H - 2}" text-anchor="end" font-size="10" fill="currentColor" opacity=".8">čas</text>
      <path class="cv" d="${d}" fill="none" stroke="#ffb020" stroke-width="3" stroke-linejoin="round"/>
      <g class="mk" opacity="0"><circle r="5" fill="#ffb020" stroke="#fff" stroke-width="2"/></g>
      <text class="ck" x="${W - r - 4}" y="${t0 + 14}" text-anchor="end" font-size="13" font-weight="700" fill="currentColor"></text></svg>`
    });
    box.append(sim);
    const svg = $('svg', sim), cv = $('.cv', svg), mk = $('.mk', svg), ck = $('.ck', svg);
    const len = cv.getTotalLength(); cv.style.strokeDasharray = len; cv.style.strokeDashoffset = len;
    const qb = el('div'); const go = el('button', { class: 'btn' }, '▶ Spusti 24 hodín'); box.append(el('div', { class: 'row' }, go), qb);
    let started = false;
    go.onclick = () => {
      if (started) return; started = true; go.disabled = true;
      const T0 = performance.now(), dur = RM ? 50 : 3200; mk.setAttribute('opacity', 1);
      const step = now => {
        const p = Math.min(1, (now - T0) / dur); const tt = 24 * p; cv.style.strokeDashoffset = len * (1 - p);
        const i = Math.min(pts.length - 1, Math.round(tt * 4)); mk.setAttribute('transform', `translate(${X(pts[i][0])} ${Y(pts[i][1])})`);
        ck.textContent = `${(tt >= sr && tt < ss) ? '☀' : '☾'} ${pad(Math.floor(tt))}:${pad(Math.floor((tt % 1) * 60))} · ${Math.round(pts[i][1])} ppm`;
        if (p < 1) requestAnimationFrame(step); else finish();
      };
      requestAnimationFrame(step);
    };
    function finish() {
      const max = pick([true, false]); const right = max ? hMax : hMin;
      const pool = [12, max ? hMin : hMax, 0, 15, 3, 9, 22].filter(h => Math.abs(h - right) >= 3);
      const opts = [right, ...[...new Set(pool)].slice(0, 3)].map(h => `o ${h}:00`);
      mc(qb, {
        q: `Odčítaj z grafu: **o koľkej hodine bolo v nádobe ${max ? 'najviac' : 'najmenej'} CO₂?**`, a: opts, why: max
          ? `V noci rastlina iba [[dýchanie|dýcha]] a CO₂ v nádobe pribúda. Ráno vyjde slnko (o ${sr}:00) a keď fotosyntéza prekoná dýchanie, CO₂ začne ubúdať. Preto je ho najviac krátko po východe slnka.`
          : `Cez deň fotosyntéza spotrebuje viac CO₂, ako dýchanie uvoľní. Večer svetla ubúda – keď fotosyntéza klesne pod dýchanie, CO₂ začne opäť pribúdať. Najmenej ho je teda krátko pred západom slnka (o ${ss}:00).`
      }, done);
    }
  }
};

T.j3a = {
  n: 'Časti rastliny', run(box, done) {
    const parts = shuffle(['koreň', 'stonka', 'list', 'kvet', 'plod']); let i = 0;
    const q = el('p', { class: 'q' }); box.append(q);
    const sim = el('div', { class: 'sim narrow', html: PART_SVG }); box.append(sim);
    const found = el('div', { class: 'found' }); box.append(found);
    const F = fbox(box);
    const R = tries(box, () => { $$('.pp', sim).forEach(g => g.classList.add('hit')); found.replaceChildren(...parts.map(p => el('span', { class: 'fac-chip out' }, '✓ ' + p))); q.replaceChildren('Toto sú všetky časti rastliny.'); i = parts.length; done(why, true); });
    const why = 'Rastlina má koreň (drží ju a pije vodu), stonku (nesie listy a vedie vodu), listy (vyrábajú potravu), kvety (z nich vzniknú plody) a plody so semenami.';
    const ask1 = () => q.replaceChildren(rich(`Ťukni na: **${parts[i].toUpperCase()}**`), el('span', { class: 'mono mut', style: { marginLeft: '8px', fontSize: '14px' } }, `${i + 1}/5`));
    ask1();
    $('svg', sim).addEventListener('click', e => {
      const g = e.target.closest('[data-p]'); if (!g || i >= parts.length) return;
      const p = g.dataset.p;

        g.classList.add('hit'); found.append(el('span', { class: 'fac-chip out' }, '✓ ' + p)); i++;
        if (i >= parts.length) { R.hide(); F.ok('Všetky časti nájdené!'); q.replaceChildren('Výborne, poznáš celú rastlinu!'); done(why); }

    s += `<circle cx="130" cy="130" r="${R0.toFixed(1)}" fill="#7a4e2a"/><path class="hl" fill="none"/></svg>`;

    const ring = (i, col) => { const a = i ? Rr[i - 1] : R0, b = Rr[i]; hl.setAttribute('d', `M${130 - b} 130a${b} ${b} 0 1 0 ${2 * b} 0a${b} ${b} 0 1 0 ${-2 * b} 0ZM${130 - a} 130a${a} ${a} 0 1 1 ${2 * a} 0a${a} ${a} 0 1 1 ${-2 * a} 0Z`); hl.setAttribute('fill', col); hl.setAttribute('fill-rule', 'evenodd'); };
    const s2 = el('div');
    const why = 'Každý rok pribudne jeden [[letokruh]]: na jar svetlé drevo s veľkými bunkami, v lete tmavšie s menšími. V suchom alebo chladnom roku strom prirastie málo a letokruh je úzky. Podľa letokruhov vedci zisťujú počasie aj spred stoviek rokov.';
    ask(box, { q: '**Koľko rokov mal strom?** Spočítaj tmavé prúžky.', ans: n, tol: 0, unit: plural(n, 'rok', 'roky', 'rokov'), hint: 'Počítaj tmavé krúžky od stredu k okraju. Kôru nepočítaj.' }, () => {

    const why = 'Pri [[osmóza|osmóze]] prechádza voda cez polopriepustnú membránu tam, kde je **väčšia koncentrácia** rozpustených látok. Bunková šťava koreňa je zvyčajne koncentrovanejšia ako pôdna voda, preto voda vstupuje do koreňa. Keď pôdu zasolíme (napríklad posypovou soľou), voda začne z koreňa unikať a rastlina vädne.';
    const R = tries(box, () => { solve(true); });
    const LAB = { in: '💧 Voda pôjde z pôdy do koreňa', out: '💧 Voda pôjde z koreňa do pôdy', eq: '⚖️ Rovnováha – voda prechádza oboma smermi rovnako' };
    function draw(arrow) {

      const ar = arrow === 'in' ? arrowSVG(120, 190, 220, 190, '#38b6ff', 6) : arrow === 'out' ? arrowSVG(220, 190, 120, 190, '#38b6ff', 6) : arrow === 'eq' ? arrowSVG(130, 184, 210, 184, '#38b6ff', 4) + arrowSVG(210, 198, 130, 198, '#38b6ff', 4) : '';
      sim.innerHTML = `<svg viewBox="0 0 340 214" role="img" aria-label="Pôdny roztok a bunka koreňa oddelené membránou" font-family="JetBrains Mono">
        <rect x="10" y="14" width="150" height="150" rx="12" fill="#8a5a36" opacity=".35"/><rect x="180" y="14" width="150" height="150" rx="40" fill="#b9e28a" opacity=".5" stroke="#7fb24f" stroke-width="2"/>
        <line x1="170" y1="14" x2="170" y2="164" stroke="currentColor" stroke-width="3" stroke-dasharray="6 5" opacity=".6"/>
        ${dots(Math.round(cur.cp * 10), 10, 1)}${dots(Math.round(cur.cb * 10), 180, 2)}
        <text x="85" y="182" text-anchor="middle" font-size="12" fill="currentColor">PÔDA ${fmt(cur.cp, 1)} %</text><text x="255" y="182" text-anchor="middle" font-size="12" fill="currentColor">KOREŇ ${fmt(cur.cb, 1)} %</text>
        ${ar}<text x="170" y="210" text-anchor="middle" font-size="10" fill="currentColor" opacity=".7">● rozpustené látky · - - membrána</text></svg>`;
    }
    function next() {
      nx.replaceChildren(); F.clear(); locked = false;
      if (round >= 3) { R.hide(); F.ok('Všetky tri situácie máš správne!'); done(why); return; }
      const cb = rndf(.6, 1.2, 1), k = kinds[round];
      const cp = k === 'in' ? rndf(.1, Math.max(.2, cb - .3), 1) : k === 'out' ? rndf(cb + .4, 3, 1) : cb;

  }
};

  $('#shade').onclick = closeSheet;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  try { window.speechSynthesis && speechSynthesis.getVoices(); } catch (e) { }
  renderHome();
}
init();
</script>
</body>
